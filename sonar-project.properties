# ==============================================================
# SonarCloud - produit-back
# ==============================================================

# -- Identification --------------------------------------------
sonar.projectKey=produit-back
sonar.projectName=Produit Back
sonar.projectVersion=0.0.1-SNAPSHOT

# -- Sources ---------------------------------------------------
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.sourceEncoding=UTF-8

# -- Couverture JaCoCo -----------------------------------------
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# -- Exclusions (entrypoint, entites, DTOs OpenAPI/MapStruct) --
sonar.exclusions=\
  **/ProduitApplication.java,\
  **/model/**,\
  **/bean/**,\
  **/entity/**

sonar.coverage.exclusions=\
  **/ProduitApplication.java,\
  **/model/**,\
  **/bean/**,\
  **/entity/**

# -- Quality Gate ----------------------------------------------
# Seuil enforce par JaCoCo dans le pom.xml (monte vers 0.80)
# SonarCloud = reporting uniquement (plan gratuit)
sonar.qualitygate.wait=false

# -- Connexion SonarCloud --------------------------------------
sonar.host.url=https://sonarcloud.io
sonar.organization=elhadj-cloud-lab
# sonar.token : passer via -Dsonar.token=... ou env SONAR_TOKEN
